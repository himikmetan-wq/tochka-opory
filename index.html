<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Личный трекер: дневник успехов, задачи, финансы и семейный бюджет — с наставником, который держит в фокусе главное: доводить начатое до конца.">
<title>Точка опоры</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=classic-20260924">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=classic-20260924">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=classic-20260924">
<link rel="manifest" href="manifest.json?v=classic-20260924">
<meta name="theme-color" content="#123C33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Точка опоры">
<style>
.account-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;justify-content:flex-end;max-width:100%;font-size:12px}
.account-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.account-bar button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px;cursor:pointer;flex:none;}
#account-control{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 10px;max-width:100%;}
.header-theme-switch{gap:0;flex:none;}
.login-card{max-width:420px;margin:12vh auto 0;padding:28px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.login-card p{color:var(--text-muted);line-height:1.5}
.login-card button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:white;font:inherit;cursor:pointer}
:root{
  --bg:#F6F3EC;
  --surface:#FFFFFF;
  --surface-2:#EEE8DA;
  --border:#D2CBB4;
  --text:#171C1E;
  --text-muted:#5B5344;
  --accent:#1F8770;
  --accent-strong:#123C33;
  --accent-soft:#D2E9E2;
  --gold:#9C6A16;
  --gold-soft:#F1E3C6;
  --positive:#1D9468;
  --positive-soft:#DEF2E8;
  --negative:#B33726;
  --negative-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(34,40,42,.08),0 6px 18px rgba(34,40,42,.08);
  --radius:16px;
  --radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121618;
    --surface:#1B2124;
    --surface-2:#252C2F;
    --border:#3C464A;
    --text:#F6F3EA;
    --text-muted:#ADB6AF;
    --accent:#6DC3B1;
    --accent-strong:#9EDACB;
    --accent-soft:#20362F;
    --gold:#E4B673;
    --gold-soft:#362A17;
    --positive:#6BD6A8;
    --positive-soft:#1D3328;
    --negative:#EC9A8F;
    --negative-soft:#3A2320;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#121618;
  --surface:#1B2124;
  --surface-2:#252C2F;
  --border:#3C464A;
  --text:#F6F3EA;
  --text-muted:#ADB6AF;
  --accent:#6DC3B1;
  --accent-strong:#9EDACB;
  --accent-soft:#20362F;
  --gold:#E4B673;
  --gold-soft:#362A17;
  --positive:#6BD6A8;
  --positive-soft:#1D3328;
  --negative:#EC9A8F;
  --negative-soft:#3A2320;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.45);
}

html{padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{min-height:100%;max-width:100%;overflow-x:hidden;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Unbounded',sans-serif;font-weight:600;margin:0;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
input,textarea{font-family:inherit;font-size:15px;}

#app{max-width:640px;margin:0 auto;padding:0 16px;overflow-x:hidden;}

.app-header{
  position:sticky;top:0;z-index:5;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:6px 12px;padding:14px 2px 12px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;color:var(--accent-strong);flex:none;}
.brand svg{width:22px;height:22px;flex:none;}
.brand span{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;color:var(--text);}
.today{font-size:12.5px;color:var(--text-muted);text-align:right;text-transform:capitalize;}

@media (max-width:600px){
  .app-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;padding:8px 2px;}
  .brand{min-width:0;gap:5px;}
  .brand svg{width:17px;height:17px;}
  .brand span{font-size:11px;white-space:nowrap;}
  .account-bar{display:contents;}
  .today{font-size:10px;white-space:nowrap;}
  #account-control{grid-column:1 / -1;flex-wrap:nowrap;gap:8px;font-size:11px;min-width:0;}
  #account-control > span{margin-right:auto;max-width:none;min-width:0;}
  .account-bar button{padding:3px 6px;font-size:11px;}
  .app-main{padding:12px 2px 100px;}
}
.app-main{min-height:60vh;}
@media (min-width:601px){.app-main{padding:18px 2px 100px;}}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;justify-content:center;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -2px 14px rgba(0,0,0,.05);
}
.tabbar-inner{display:flex;width:100%;max-width:640px;justify-content:space-between;gap:1px;}
.tabbar-inner{overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;}
.tabbar-inner::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-muted);padding:6px 1px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:10.5px;letter-spacing:.01em;
}
.tab-btn span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tab-btn svg{width:21px;height:21px;flex:none;}
.tab-btn.active{color:var(--accent);}
@media (max-width:360px){
  .tab-btn{font-size:9.5px;}
  .tab-btn svg{width:19px;height:19px;}
}
.tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 10px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.stack{display:flex;flex-direction:column;gap:14px;}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 10px;box-shadow:var(--shadow);}
.stat-tile .label{font-size:11px;color:var(--text-muted);margin-bottom:4px;}
.stat-tile .value{font-size:17px;font-weight:600;}
.stat-tile .value.positive{color:var(--positive);}
.stat-tile .value.negative{color:var(--negative);}
@media (max-width:420px){.stat-grid{grid-template-columns:repeat(3,1fr);gap:7px;}.stat-tile{padding:10px 7px;}.stat-tile .value{font-size:15px;}}

.btn{border:1px solid transparent;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-positive{background:var(--positive-soft);color:var(--positive);}
.btn-negative{background:var(--negative-soft);color:var(--negative);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:default;}
.icon-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px 8px;font-size:18px;line-height:1;border-radius:8px;}
.icon-btn.danger:hover{color:var(--negative);background:var(--negative-soft);}

.input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;color:var(--text);}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;}
textarea.input{resize:vertical;min-height:44px;}
.add-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:14px;}
.add-row .grow{flex:1 1 160px;}
.add-row.quick-add{flex-wrap:nowrap;align-items:stretch;}
.quick-add .grow{flex:1;min-width:0;}
.quick-add .add-plus{width:40px;min-width:40px;padding:0;border-radius:10px;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;}
.quick-add textarea.input{min-height:88px;}
.row{display:flex;gap:8px;align-items:center;}
.row.between{justify-content:space-between;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.pill-group{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pill{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head .label{font-weight:600;text-transform:capitalize;font-size:14.5px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-wd{text-align:center;font-size:10.5px;color:var(--text-muted);padding-bottom:4px;}
.cal-day{position:relative;aspect-ratio:1;border:none;background:var(--surface-2);border-radius:9px;color:var(--text);font-size:12.5px;cursor:pointer;}
.cal-day.pad{visibility:hidden;pointer-events:none;}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-day.selected{background:var(--accent);color:#fff;}
.cal-day .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold);}
.cal-day.selected .dot{background:#fff;}

.entry-card{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.entry-card .entry-time{font-size:11px;color:var(--text-muted);margin-bottom:3px;}
.entry-card .entry-text{white-space:pre-wrap;}

.coach-card{position:relative;overflow:hidden;padding:0;border-color:var(--accent-soft);background-color:var(--accent-soft);min-height:208px;display:flex;flex-direction:column;justify-content:flex-end;}
.coach-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .18s ease;}
.coach-bg.fade{opacity:0;}
.coach-content{position:relative;z-index:1;padding:54px 18px 16px;}
.coach-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-strong);margin-bottom:8px;}
.coach-text{font-family:'Unbounded',sans-serif;font-size:16px;line-height:1.4;font-weight:600;min-height:66px;opacity:1;transition:opacity .18s ease;color:var(--accent-strong);}
.coach-text.fade{opacity:0;}
.coach-controls{display:flex;align-items:center;gap:10px;margin-top:12px;}
.theme-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.theme-switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;color:var(--text-muted);white-space:nowrap;}
.theme-switch input{position:absolute;width:1px;height:1px;opacity:0;}
.theme-slider{width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;transition:background .2s;flex:none;}
.theme-slider::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;left:3px;top:3px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;}
.theme-switch input:checked + .theme-slider{background:var(--accent);}
.theme-switch input:checked + .theme-slider::before{transform:translateX(18px);}
.theme-switch input:focus-visible + .theme-slider{outline:2px solid var(--accent);outline-offset:3px;}

.abandon-form{display:flex;flex-direction:column;gap:6px;padding:8px 2px;border-bottom:1px solid var(--border);}
.abandon-form .task-text-preview{font-size:13px;color:var(--text-muted);}
.task-text.abandoned{color:var(--text-muted);}
.abandon-reason{font-size:12px;color:var(--gold);font-style:italic;margin-top:2px;}
.task-row.stacked{flex-direction:column;align-items:flex-start;gap:4px;}
.task-row .task-main{display:flex;align-items:center;gap:10px;width:100%;}

.task-row{display:flex;align-items:center;gap:7px;padding:7px 2px;border-bottom:1px solid var(--border);background:var(--surface);}
.task-row:last-child{border-bottom:none;}
.task-row.dragging-placeholder{opacity:0;}
.task-row-drag-clone{box-shadow:var(--shadow);border-radius:var(--radius-sm);z-index:9999;pointer-events:none;opacity:.97;border-bottom:none !important;}
.drag-handle{display:flex;align-items:center;justify-content:center;width:15px;height:21px;flex:none;color:var(--text-muted);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;margin-top:2px;}
.drag-handle:active{cursor:grabbing;}
.task-row .checkbox{margin-top:0;}
.journal-entry{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--border);}
.journal-entry:last-child{border-bottom:none;}
.journal-entry .entry-text{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;}
.journal-entry .checkbox{flex:none;}
.journal-entry-actions{display:flex;align-items:center;flex:none;gap:1px;}
.journal-entry-actions .icon-btn{padding:3px 5px;font-size:16px;}
.task-row-actions{display:flex;align-items:center;gap:1px;flex:none;}
.task-row-actions .icon-btn{padding:2px 5px;font-size:15px;}
.tracker-subtask.dragging-placeholder{opacity:0;}
.tracker-subtask-drag-clone{box-shadow:var(--shadow);border-radius:var(--radius-sm);z-index:9999;pointer-events:none;opacity:.97;background:var(--surface);}
.champion-card{background:linear-gradient(135deg,#123C33,#0A2620);border:1px solid #1E5C4C;color:#EAF7F2;box-shadow:var(--shadow);}
.champion-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.champion-title{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#9EDACB;margin-bottom:0;}
.champion-pencil{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#9EDACB;width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;padding:0;}
.champion-pencil:hover{background:rgba(255,255,255,.16);}
.champion-reward{background:rgba(46,230,197,.14);border:1px solid rgba(46,230,197,.35);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:600;color:#6FF0D6;margin-bottom:10px;}
.champion-item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.08);}
.champion-item:last-child{border-bottom:none;}
.champion-item .checkbox{border-color:rgba(255,255,255,.4);background:transparent;}
.champion-item .checkbox.checked{background:#2EE6C5;border-color:#2EE6C5;}
.champion-item .checkbox.checked::after{border-color:#0A2620;}
.champion-item .checkbox.pending{opacity:.45;pointer-events:none;}
.champion-item-text{flex:1;color:#EAF7F2;}
.champion-item-text.done{color:#8FB8AE;text-decoration:line-through;}
.champion-edit-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
.champion-edit-row .input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#EAF7F2;}
.champion-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.champion-link{background:none;border:none;color:#9EDACB;font-size:12px;cursor:pointer;padding:4px 0;text-decoration:underline;}
.champion-streak-wrap{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);}
.champion-streak-label{font-size:11px;color:#8FB8AE;margin-bottom:6px;}
.champion-dashes{display:flex;flex-wrap:wrap;gap:5px;}
.champion-dash{width:16px;height:5px;border-radius:3px;background:#2EE6C5;box-shadow:0 0 6px 1px rgba(46,230,197,.85),0 0 2px rgba(46,230,197,1);}
.champion-dash.future{background:rgba(255,255,255,.12);box-shadow:none;}
.checkbox{width:21px;height:21px;flex:none;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;position:relative;}
.checkbox.checked{background:var(--accent);border-color:var(--accent);}
.checkbox.checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
.task-text{flex:1;min-width:0;word-break:break-word;padding-top:2px;}
.task-text.done{color:var(--text-muted);text-decoration:line-through;}
.task-actions{display:flex;align-items:center;flex:none;}
.inline-edit{width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--border);}
.inline-edit .input{flex:1 1 160px;}
.progress-track{display:flex;gap:3px;height:8px;margin:10px 0 5px;}
.progress-segment{flex:1;min-width:0;border-radius:5px;background:var(--surface-2);transition:background .2s;}
.progress-segment.done{background:var(--accent);}
.tracker-item{padding:12px 0;border-top:1px solid var(--border);}
.tracker-item:first-of-type{border-top:0;}
.tracker-subtask{display:flex;align-items:center;gap:8px;padding:7px 0 7px 10px;}
.tracker-subtask .task-text{font-size:13.5px;}
.subtask-actions{display:flex;align-items:center;gap:0;flex:none;}
.subtask-actions .icon-btn{padding:4px 3px;font-size:16px;}
.budget-add-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(72px,120px);gap:8px;}
.budget-add-row .input{min-width:0;width:100%;max-width:none!important;}
.budget-add-row > button{grid-column:1 / -1;width:100%;height:32px;padding:2px 12px;border-radius:999px;font-size:22px;line-height:1;}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;}
.recording{background:var(--negative-soft);color:var(--negative);}
.mic-btn{width:50px;height:44px;justify-content:center;padding:4px;background:#fff;color:#22282a;border:1px solid var(--border);border-radius:10px;}
.mic-btn:hover{border-color:var(--accent);}

(function(){

  window.finishBootSplash=function(){
    if(finished)return;

    clearTimeout(timer);
    var wait=Math.max(0,readyAt-Date.now());
    setTimeout(function(){
      var el=document.getElementById('boot-splash');
      if(!el)return;
      var portal=document.getElementById('boot-portal');
      var app=document.getElementById('app');
      if(portal && app){

        clone.style.cssText='position:absolute;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);overflow:hidden;background:var(--bg);';
        portal.appendChild(clone);
      }
      el.classList.add('launching');
      setTimeout(function(){el.classList.add('done');setTimeout(function(){el.remove();},90);},1420);
    },wait);
  };
  window.setBootStatus=function(text){var el=document.getElementById('boot-status-text');if(el)el.textContent=text;};
  timer=setTimeout(function(){
    var main=document.getElementById('main-content');

})();

  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=order[i];order[i]=order[j];order[j]=tmp;}
  if(order.length>1 && order[order.length-1]===avoid){var k=order[0];order[0]=order[order.length-1];order[order.length-1]=k;}

}

async function withRetry(fn, attempts, delayMs){
  attempts = attempts || 4; delayMs = delayMs || 1000;
  var lastErr;
  for(var i=0;i<attempts;i++){
    try { return await fn(); }
    catch(e){
      lastErr = e;
      if(!isOfflineError(e) || i===attempts-1) throw e;
      await sleep(delayMs * (i+1));
    }
  }
  throw lastErr;
}

function _fsDocRef(coll, id){ return doc(_fsDb, 'users', activeUser.uid, coll, id); }
function _fsCollRef(coll){ return collection(_fsDb, 'users', activeUser.uid, coll); }

function localDoc(path){
  var parts = path.split('/'); var coll = parts[0], id = parts[1];
  var ref = _fsDocRef(coll, id);
  return {
    id:id, path:path,
    get: function(){
      return getDoc(ref).then(function(snap){
        return { id:id, exists: snap.exists(), data:function(){ return snap.exists() ? snap.data() : undefined; } };
      });
    },
    set: function(data){ return setDoc(ref, clone(data)); },
    update: function(data){ return updateDoc(ref, clone(data)); },
    delete: function(){ return deleteDoc(ref); }
  };
}
function localCollection(coll){
  var filters=[], order=null, lim=null;
  var api = {
    where:function(f,op,v){ filters.push([f,op,v]); return api; },
    orderBy:function(f,dir){ order=[f, dir||'asc']; return api; },
    limit:function(n){ lim=n; return api; },
    get:function(){
      var qc = _fsCollRef(coll);
      var constraints = filters.map(function(f){ return where(f[0], f[1], f[2]); });
      if(order) constraints.push(orderBy(order[0], order[1]));
      if(lim) constraints.push(limit(lim));
      var q = constraints.length ? query.apply(null, [qc].concat(constraints)) : qc;
      return getDocs(q).then(function(snap){
        var docs = snap.docs.map(function(d){ return { id:d.id, exists:true, data:function(){ return d.data(); } }; });
        return { docs:docs, size:docs.length, empty:docs.length===0 };
      });
    },
    doc:function(id){ id = id || uid(); return localDoc(coll+'/'+id); },
    add:function(data){
      return addDoc(_fsCollRef(coll), clone(data)).then(function(ref){ return localDoc(coll+'/'+ref.id); });
    }
  };
  return api;
}

function stepCoach(dir, isAuto){
  if(dir<0){
    if(coachPosition===0)return;
    coachPosition--;
  }else if(coachPosition<coachHistory.length-1){
    coachPosition++;
  }else{
    if(!coachDeck.length)coachDeck=shuffledCoachIndices(state.coach.index);
    coachHistory.push(coachDeck.pop());
    coachPosition++;
    if(coachHistory.length>100){coachHistory.shift();coachPosition--;}
  }
  state.coach.index=coachHistory[coachPosition];
  var textEl = document.getElementById('coach-phrase');
  var counterEl = document.getElementById('coach-counter');
  var bgEl = document.getElementById('coach-bg');
  var apply = function(){
    if(textEl) textEl.textContent = COACH_TIPS[state.coach.index];
    if(counterEl) counterEl.textContent = (state.coach.index+1)+'/'+COACH_TIPS.length;
    if(bgEl) bgEl.setAttribute('style', coachBgStyle(state.coach.index));
  };
  if(textEl && !REDUCED_MOTION){
    textEl.classList.add('fade');
    if(bgEl) bgEl.classList.add('fade');
    setTimeout(function(){ apply(); textEl.classList.remove('fade'); if(bgEl) bgEl.classList.remove('fade'); }, 180);
  } else { apply(); }
  if(!isAuto) startCoachRotation();
}

  if(!dbReady){ el.innerHTML = renderDbUnavailable(); return; }
  if(state.tab==='summary'){ el.innerHTML = renderSummary(); }
  else if(state.tab==='journal') el.innerHTML = renderJournal();
  else if(state.tab==='tasks'){ el.innerHTML = renderTasks(); initTaskDrag(); }
  else if(state.tab==='tracker'){ el.innerHTML = renderTracker(); initTrackerSubtaskDrag(); }
  else if(state.tab==='finance') el.innerHTML = renderFinance();
  else if(state.tab==='budget'){ el.innerHTML = renderBudget(); initBudgetDrag(); }
}

function renderDbUnavailable(){
  return '<div class="card empty-state"><div class="big">…</div>Не удалось получить доступ к хранилищу браузера.<br>Проверьте, не включён ли приватный режим, и обновите страницу.</div>';
}

/* =========================================================
   JOURNAL — Дневник успехов
   ========================================================= */
async function loadJournalMonth(){
  state.journal.loading = true;
  renderMain();
  var y=state.journal.year, m=state.journal.month;
  var start = fmtKey(new Date(y,m,1));
  var end = fmtKey(new Date(y,m+1,0));
  var snap = await safe(refJournalColl().where('date','>=',start).where('date','<=',end).get(), 'Не удалось загрузить дневник');
  var marked = {};
  if(snap){ snap.docs.forEach(function(d){ var data=d.data(); if(data && data.entries && data.entries.length) marked[d.id]=true; }); }
  state.journal.marked = marked;
  state.journal.loading = false;
  renderMain();
  loadJournalDay(state.journal.selected);
}
function computeJournalStats(markedAll){
  var totalDays = Object.keys(markedAll).length;
  var today = todayDate();
  var tKey = fmtKey(today);
  var cursor = markedAll[tKey] ? today : addDays(today,-1);
  var streak = 0;
  while(markedAll[fmtKey(cursor)]){
    streak++;
    cursor = addDays(cursor,-1);
  }
  return { totalDays:totalDays, streak:streak };
}
async function loadJournalStats(){
  state.journal.statsLoading = true;
  renderMain();
  var snap = await safe(refJournalColl().get(), 'Не удалось загрузить статистику дневника');
  var markedAll = {};
  if(snap){ snap.docs.forEach(function(d){ var data=d.data(); if(data && data.entries && data.entries.length) markedAll[d.id]=true; }); }
  state.journal.allMarked = markedAll;
  var stats = computeJournalStats(markedAll);
  state.journal.totalDays = stats.totalDays;
  state.journal.streak = stats.streak;
  state.journal.statsLoading = false;
  renderMain();
}
async function loadJournalDay(key){
  state.journal.dayLoading = true;
  state.journal.selected = key;
  state.journal.editingId = null;
  renderMain();
  var snap = await safe(refJournalDoc(key).get(), 'Не удалось загрузить запись');
  state.journal.entries = (snap && snap.exists && snap.data().entries) ? snap.data().entries : [];
  state.journal.dayLoading = false;
  renderMain();
}
async function addJournalEntry(text){
  var key = state.journal.selected;
  var entry = { id:uid(), text:text, createdAt:nowISO() };
  var entries = state.journal.entries.concat([entry]);
  var ok = await safe(refJournalDoc(key).set({ date:key, entries:entries, updatedAt:nowISO() }), 'Не удалось сохранить запись');
  if(ok!==null){
    state.journal.entries = entries;
    state.journal.marked[key] = true;
    if(!state.journal.allMarked[key]){
      state.journal.allMarked[key] = true;
      var stats = computeJournalStats(state.journal.allMarked);
      state.journal.totalDays = stats.totalDays;
      state.journal.streak = stats.streak;
    }
    toast('Записано');
    renderMain();
  }
}
async function deleteJournalEntry(entryId){
  var key = state.journal.selected;
  var entries = state.journal.entries.filter(function(e){ return e.id!==entryId; });
  var ok = await safe(refJournalDoc(key).set({ date:key, entries:entries, updatedAt:nowISO() }), 'Не удалось удалить запись');
  if(ok!==null){
    state.journal.entries = entries;
    var hasEntries = entries.length>0;
    state.journal.marked[key] = hasEntries;
    if(!hasEntries && state.journal.allMarked[key]){
      delete state.journal.allMarked[key];
      var stats2 = computeJournalStats(state.journal.allMarked);
      state.journal.totalDays = stats2.totalDays;
      state.journal.streak = stats2.streak;
    }
    renderMain();
  }
}
function startEditJournalEntry(entryId){ state.journal.editingId = entryId; renderMain(); }
function cancelEditJournalEntry(){ state.journal.editingId = null; renderMain(); }
async function saveJournalEntry(entryId, newText){
  var key = state.journal.selected;
  var entries = state.journal.entries.map(function(e){
    return e.id===entryId ? Object.assign({}, e, { text:newText, updatedAt:nowISO() }) : e;
  });
  var ok = await safe(refJournalDoc(key).set({ date:key, entries:entries, updatedAt:nowISO() }), 'Не удалось сохранить изменения');
  if(ok!==null){
    state.journal.entries = entries;
    state.journal.editingId = null;
    toast('Изменено');
    renderMain();
  }
}

function buildCalGrid(year,month,markedMap,selectedKey,todayK,actionName){
  var first = new Date(year,month,1);
  var startOffset = (first.getDay()+6)%7;
  var daysInMonth = new Date(year,month+1,0).getDate();
  var cells = '';
  for(var i=0;i<startOffset;i++) cells += '<div class="cal-day pad"></div>';
  for(var day=1; day<=daysInMonth; day++){
    var key = year+'-'+pad2(month+1)+'-'+pad2(day);
    var cls = 'cal-day';
    if(key===selectedKey) cls += ' selected';
    if(key===todayK) cls += ' today';
    var dot = markedMap[key] ? '<span class="dot"></span>' : '';
    cells += '<button class="'+cls+'" data-action="'+actionName+'" data-key="'+key+'">'+day+dot+'</button>';
  }
  var wd = WEEKDAYS.map(function(w){ return '<div class="cal-wd">'+w+'</div>'; }).join('');
  return '<div class="cal-grid">'+wd+cells+'</div>';
}

/* =========================================================
   TASKS — Трекер дел
   ========================================================= */
async function loadTasks(){
  state.tasks.loading = true;
  renderMain();
  var snap = await safe(refTasks().orderBy('createdAt','asc').get(), 'Не удалось загрузить задачи');
  state.tasks.items = snap ? snap.docs.filter(function(d){ return !d.data().kind; }).map(function(d){ var v=d.data(); v.id=d.id; return v; }) : [];
  state.tasks.loading = false;
  renderMain();
}
async function addTask(text){
  var active = sortedActiveTasks(state.tasks.items);
  var data = { text:text, done:false, abandoned:false, createdAt:nowISO(), doneAt:null, abandonedAt:null, abandonReason:'' };
  var hasOrder = active.some(function(t){ return t.order!=null; });
  if(hasOrder){
    var maxOrder = active.reduce(function(m,t){ return t.order!=null ? Math.max(m,t.order) : m; }, -1);
    data.order = maxOrder+1;
  }
  var ref = await safe(refTasks().add(data), 'Не удалось добавить задачу');
  if(ref){ loadTasks(); }
}
async function reorderTasks(idsInOrder){
  idsInOrder.forEach(function(id, idx){
    var t = state.tasks.items.find(function(x){ return x.id===id; });
    if(t) t.order = idx;
  });
  var results = await Promise.all(idsInOrder.map(function(id, idx){
    return safe(refTasks().doc(id).update({ order: idx }));
  }));
  if(results.indexOf(null) !== -1) toast('Не удалось сохранить порядок задач');
}
async function toggleTask(id, newDone){
  var ok = await safe(saveTaskWithSuccess(id, { done:newDone, doneAt:newDone?nowISO():null, abandoned:false, abandonedAt:null, abandonReason:'' }, newDone), 'Не удалось обновить задачу');
  if(ok!==null){
    var t = state.tasks.items.find(function(x){ return x.id===id; });
    if(t){ t.done=newDone; t.doneAt = newDone?nowISO():null; t.abandoned=false; t.abandonReason=''; }
    renderMain();
  }
}
async function saveTaskWithSuccess(id, fields, completed){
  var taskRef=_fsDocRef('tasks', id), date=todayKey();
  return runTransaction(_fsDb, async function(tx){
    var taskSnap=await tx.get(taskRef);
    if(!taskSnap.exists()) throw new Error('Дело больше не существует');
    var old=taskSnap.data(), changed=Boolean(old.done)!==Boolean(completed);
    var successDate=changed ? (completed ? date : old.successDate) : null;
    var journalRef=successDate ? _fsDocRef('journal', successDate) : null;
    var journalSnap=journalRef ? await tx.get(journalRef) : null;
    var patch=Object.assign({}, fields, {updatedAt:nowISO()});
    if(changed && completed) patch.successDate=date;
    if(changed && !completed) patch.successDate=null;
    tx.update(taskRef, patch);
    if(journalRef){
      var data=journalSnap.exists() ? journalSnap.data() : {};
      var entries=(data.entries||[]).filter(function(e){return e.sourceTaskId!==id;});
      if(completed) entries.push({id:uid(),text:'Выполнено: '+(fields.text||old.text),createdAt:nowISO(),sourceTaskId:id});
      tx.set(journalRef,{date:successDate,entries:entries,updatedAt:nowISO()});
    }
  });
}
async function abandonTask(id, reason){
  var ok = await safe(refTasks().doc(id).update({ abandoned:true, abandonedAt:nowISO(), abandonReason:reason, done:false, doneAt:null }), 'Не удалось сохранить');
  if(ok!==null){
    var t = state.tasks.items.find(function(x){ return x.id===id; });
    if(t){ t.abandoned=true; t.abandonedAt=nowISO(); t.abandonReason=reason; t.done=false; }
    state.tasks.abandoningId = null;
    toast('Записано. Это честнее, чем молча удалить.');
    renderMain();
  }
}
async function deleteTask(id){
  var ok = await safe(refTasks().doc(id).delete(), 'Не удалось удалить задачу');
  if(ok!==null){
    state.tasks.items = state.tasks.items.filter(function(x){ return x.id!==id; });
    renderMain();
  }
}
async function editTask(id, text){
  var ok = await safe(refTasks().doc(id).update({text:text, updatedAt:nowISO()}), 'Не удалось сохранить дело');
  if(ok!==null){
    var item=state.tasks.items.find(function(t){return t.id===id;});
    if(item) item.text=text;
    state.tasks.editingId=null;
    renderMain();
  }
}
function taskCounts(items){
  var done = items.filter(function(t){ return t.done; }).length;
  var abandoned = items.filter(function(t){ return t.abandoned; }).length;
  var total = done+abandoned;
  return { done:done, abandoned:abandoned, index: total? done/total : null };
}

function sortedActiveTasks(items){
  var active = items.filter(function(t){ return !t.done && !t.abandoned; });
  active.sort(function(a,b){
    var ao = a.order, bo = b.order;
    if(ao==null && bo==null) return 0;
    if(ao==null) return -1;
    if(bo==null) return 1;
    return ao-bo;
  });
  return active;
}
function renderActiveTaskListHTML(active, abandoningId){
  if(!active.length){
    return '<div class="empty-state">Активных задач нет. Добавьте то, что сейчас действительно актуально.</div>';
  }
  return '<div id="active-task-list">' + active.map(function(t){ return taskRow(t, abandoningId===t.id, true); }).join('') + '</div>';
}
function renderTasks(){
  var st = state.tasks;
  var active = sortedActiveTasks(st.items);
  var done = st.items.filter(function(t){ return t.done; }).sort(function(a,b){ return (b.doneAt||'').localeCompare(a.doneAt||''); });
  var abandoned = st.items.filter(function(t){ return t.abandoned; }).sort(function(a,b){ return (b.abandonedAt||'').localeCompare(a.abandonedAt||''); });
  var counts = taskCounts(st.items);

  var html = '<div class="card">';
  html += '<form class="add-row quick-add" data-action="add-task">';
  html += '<input class="input grow" type="text" name="text" maxlength="200" placeholder="Новая задача" required>';
  html += '<button type="submit" class="btn btn-primary add-plus" aria-label="Добавить дело">+</button>';
  html += '</form>';

  if(st.loading){
    html += '<div class="skeleton"></div><div class="skeleton" style="width:70%"></div>';
  } else {
    html += renderActiveTaskListHTML(active, st.abandoningId);
  }
  html += '</div>';

  if(!st.loading && counts.index!==null){
    html += '<div class="card"><div class="row between"><span class="muted">Индекс завершения</span><span class="mono" style="font-weight:700">'+Math.round(counts.index*100)+'%</span></div>'
      + '<div class="hint">'+counts.done+' закрыто · '+counts.abandoned+' заброшено осознанно</div></div>';
  }

  if(!st.loading && done.length){
    html += '<div class="card"><details class="done-section"><summary>Выполнено ('+done.length+')</summary>';
    html += done.map(function(t){ return taskRow(t,false); }).join('');
    html += '</details></div>';
  }
  if(!st.loading && abandoned.length){
    html += '<div class="card"><details class="done-section"><summary>Заброшено ('+abandoned.length+')</summary>';
    html += abandoned.map(function(t){ return taskRow(t,false); }).join('');
    html += '</details></div>';
  }
  return html;
}
function taskRow(t, abandoning, draggable){
  if(state.tasks.editingId===t.id){
    return '<form class="inline-edit" data-action="edit-task" data-id="'+t.id+'"><input class="input" name="text" maxlength="200" value="'+esc(t.text)+'" required aria-label="Название дела"><button class="btn btn-primary btn-sm">Сохранить</button><button type="button" class="btn btn-ghost btn-sm" data-action="edit-task-cancel">Отмена</button></form>';
  }
  if(abandoning){
    return '<form class="abandon-form" data-action="confirm-abandon" data-id="'+t.id+'">'
      + '<div class="task-text-preview">'+esc(t.text)+'</div>'
      + '<input class="input" type="text" name="reason" maxlength="200" placeholder="Почему бросаешь? Одна фраза." required autofocus>'
      + '<div class="btn-row"><button type="submit" class="btn btn-negative btn-sm">Подтвердить</button><button type="button" class="btn btn-ghost btn-sm" data-action="abandon-task-cancel">Отмена</button></div>'
      + '</form>';
  }
  if(t.abandoned){
    return '<div class="task-row stacked">'
      + '<div class="task-main"><span class="task-text abandoned">'+esc(t.text)+'</span><button class="icon-btn" data-action="edit-task-start" data-id="'+t.id+'" aria-label="Редактировать дело" title="Редактировать">✎</button><button class="icon-btn danger" data-action="delete-task" data-id="'+t.id+'" aria-label="Удалить">×</button></div>'
      + '<div class="abandon-reason">'+esc(t.abandonReason||'')+'</div>'
      + '</div>';
  }
  var handle = draggable
    ? '<span class="drag-handle" data-drag-handle aria-label="Изменить порядок" title="Потяните, чтобы изменить порядок">'
      + '<svg viewBox="0 0 24 24" width="13" height="13"><circle cx="8" cy="6" r="1.6" fill="currentColor"/><circle cx="16" cy="6" r="1.6" fill="currentColor"/><circle cx="8" cy="12" r="1.6" fill="currentColor"/><circle cx="16" cy="12" r="1.6" fill="currentColor"/><circle cx="8" cy="18" r="1.6" fill="currentColor"/><circle cx="16" cy="18" r="1.6" fill="currentColor"/></svg>'
      + '</span>'
    : '';
  var actions = (t.done ? '' : '<button class="icon-btn" data-action="abandon-task-start" data-id="'+t.id+'" aria-label="Забросить" title="Забросить">⚑</button>')
    + '<button class="icon-btn" data-action="edit-task-start" data-id="'+t.id+'" aria-label="Редактировать дело" title="Редактировать">✎</button>'
    + '<button class="icon-btn danger" data-action="delete-task" data-id="'+t.id+'" aria-label="Удалить">×</button>';
  return '<div class="task-row'+(draggable?' task-row-draggable" data-drag-row':'')+'" data-id="'+t.id+'">'
    + handle
    + '<button class="checkbox '+(t.done?'checked':'')+'" data-action="toggle-task" data-id="'+t.id+'" data-done="'+(!t.done)+'" aria-label="Отметить"></button>'
    + '<span class="task-text '+(t.done?'done':'')+'">'+esc(t.text)+'</span>'
    + '<div class="task-row-actions">'+actions+'</div>'
    + '</div>';
}

/* ---------- generic pointer-based drag-to-reorder ---------- */
var activeDrag = null;
function initDragList(list, onDragEnd){
  if(!list || list.__dragInit) return;
  list.__dragInit = true;
  list.addEventListener('pointerdown', function(e){ onDragListPointerDown(e, list, onDragEnd); }, {passive:false});
}
function onDragListPointerDown(e, list, onDragEnd){
  if(e.button!=null && e.button!==0) return;
  var handle = e.target.closest('[data-drag-handle]');
  if(!handle) return;
  var row = handle.closest('[data-drag-row]');
  if(!row || row.parentElement!==list) return;
  e.preventDefault();
  var rect = row.getBoundingClientRect();
  var clone = row.cloneNode(true);
  clone.classList.add(row.classList.contains('tracker-subtask') ? 'tracker-subtask-drag-clone' : 'task-row-drag-clone');
  clone.style.position = 'fixed';
  clone.style.left = rect.left+'px';
  clone.style.top = rect.top+'px';
  clone.style.width = rect.width+'px';
  clone.style.margin = '0';
  document.body.appendChild(clone);
  row.classList.add('dragging-placeholder');
  activeDrag = { row:row, list:list, clone:clone, startY:e.clientY, baseTop:rect.top, height:rect.height, onDragEnd:onDragEnd };
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  document.addEventListener('pointermove', onDragListMove, {passive:false});
  document.addEventListener('pointerup', onDragListEnd);
  document.addEventListener('pointercancel', onDragListEnd);
}
function onDragListMove(e){
  var d = activeDrag;
  if(!d) return;
  e.preventDefault();
  var top = d.baseTop + (e.clientY - d.startY);
  d.clone.style.top = top+'px';
  var center = top + d.height/2;
  var siblings = Array.prototype.filter.call(d.list.children, function(el){ return el!==d.row; });
  var targetNode = null;
  for(var i=0;i<siblings.length;i++){
    var r = siblings[i].getBoundingClientRect();
    if(center < r.top + r.height/2){ targetNode = siblings[i]; break; }
  }
  if(targetNode) d.list.insertBefore(d.row, targetNode);
  else d.list.appendChild(d.row);
}
function onDragListEnd(){
  var d = activeDrag;
  if(!d) return;
  document.removeEventListener('pointermove', onDragListMove);
  document.removeEventListener('pointerup', onDragListEnd);
  document.removeEventListener('pointercancel', onDragListEnd);
  d.clone.remove();
  d.row.classList.remove('dragging-placeholder');
  var ids = Array.prototype.map.call(d.list.children, function(el){ return el.dataset.id; });
  var cb = d.onDragEnd;
  activeDrag = null;
  cb(ids);
}
function initTaskDrag(){
  initDragList(document.getElementById('active-task-list'), reorderTasks);
}
function initTrackerSubtaskDrag(){
  Array.prototype.forEach.call(document.querySelectorAll('.subtask-list[data-tracker-id]'), function(list){
    var trackerId = list.dataset.trackerId;
    initDragList(list, function(ids){ reorderSubtasks(trackerId, ids); });
  });
}

/* =========================================================
   TRACKER — Длинные дела с подзадачами
   ========================================================= */
async function loadTracker(){

var speechSession=null;
function stopDictation(){if(speechSession){speechSession.recognition.stop();} }
function startDictation(targetId){
  if(speechSession){stopDictation();return;}
  var Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Speech){toast('Распознавание голоса недоступно в этом браузере. Можно написать заметку вручную.');return;}
  var field=targetId==='new'?document.getElementById('new-note-text'):document.getElementById('note-text-'+targetId);
  if(!field)return;
  var recognition=new Speech(), prefix=field.value.trim(), transcript='',failed=false;
  recognition.lang='ru-RU';recognition.continuous=true;recognition.interimResults=true;
  speechSession={recognition:recognition};
  var button=document.querySelector('[data-action="dictate-note"][data-id="'+targetId+'"]');
  if(button){button.classList.add('recording');button.setAttribute('aria-label','Остановить запись');}
  recognition.onresult=function(event){
    var final='', interim='';
    for(var i=0;i<event.results.length;i++){
      if(event.results[i].isFinal)final+=event.results[i][0].transcript+' ';
      else interim+=event.results[i][0].transcript;
    }
    transcript=final.trim();field.value=[prefix,transcript,interim].filter(Boolean).join(' ');
    if(targetId==='new')state.notes.draft=field.value;
  };
  recognition.onerror=function(event){failed=true;toast(event.error==='not-allowed'?'Разрешите микрофон для этого сайта в настройках браузера':'Не удалось распознать речь. Проверьте микрофон.');};
  recognition.onend=function(){
    speechSession=null;
    if(button){button.classList.remove('recording');button.setAttribute('aria-label','Продиктовать заметку');}
    if(!failed && targetId==='new' && transcript){addNote([prefix,transcript].filter(Boolean).join(' '));}
    else if(targetId==='new')state.notes.draft=field.value;
  };
  try{recognition.start();toast('Говорите. Нажмите ■, когда закончите.');}
  catch(e){speechSession=null;if(button)button.classList.remove('recording');toast('Не удалось включить микрофон');}
}

/* =========================================================
   CHAMPION — ежедневные неотложные дела
   ========================================================= */
var CHAMPION_DEFAULT_ITEMS = [
  { id:'water', text:'Стакан воды с подъёма' },
  { id:'warmup', text:'Разминка' },
  { id:'breakfast', text:'Завтрак чемпиона' }
];
var CHAMPION_LOG_DAYS_BACK = 400;

function computeChampionStreak(items, log){
  var itemIds = items.map(function(it){ return it.id; });
  if(!itemIds.length) return { streak:0, todayDone:false };
  function dayComplete(key){
    var rec = log[key];
    return !!rec && itemIds.every(function(id){ return rec.indexOf(id)!==-1; });
  }
  var today = todayDate();
  var tKey = fmtKey(today);
  var todayDone = dayComplete(tKey);
  var streak = 0;
  var cursor = todayDone ? today : addDays(today,-1);
  while(dayComplete(fmtKey(cursor))){
    streak++;
    cursor = addDays(cursor,-1);
  }
  return { streak:streak, todayDone:todayDone };
}

async function loadChampion(){
  state.champion.loading = true;
  renderMain();
  var snap = await safe(refChampionDoc().get(), 'Не удалось загрузить дела чемпиона');
  var items;
  if(snap && snap.exists && snap.data() && (snap.data().items||[]).length){
    items = snap.data().items;
  } else {
    items = clone(CHAMPION_DEFAULT_ITEMS);
    await safe(refChampionDoc().set({ items:items, updatedAt:nowISO() }));
  }

  var cutoff = fmtKey(addDays(todayDate(), -CHAMPION_LOG_DAYS_BACK));
  var logSnap = await safe(refChampionLogColl().where('date','>=',cutoff).get());
  var log = {};
  if(logSnap){
    logSnap.docs.forEach(function(d){
      var data = d.data();
      log[data.date] = data.doneIds || [];
    });
  }

  var streakInfo = computeChampionStreak(items, log);
  state.champion = {
    loading:false, items:items, log:log,
    streak:streakInfo.streak, todayDone:streakInfo.todayDone,
    editing:false, draftItems:null, pending:{}
  };
  renderMain();
}

async function saveChampionToggleWithSuccess(id, tKey, itemIds){
  var logRef = _fsDocRef('championLog', tKey);
  var journalRef = _fsDocRef('journal', tKey);
  return runTransaction(_fsDb, async function(tx){
    var logSnap = await tx.get(logRef);
    var journalSnap = await tx.get(journalRef);
    var before = logSnap.exists() ? (logSnap.data().doneIds || []) : [];
    var current = before.slice();
    var idx = current.indexOf(id);
    if(idx!==-1) current.splice(idx,1); else current.push(id);
    var wasAllDone = itemIds.length>0 && itemIds.every(function(x){ return before.indexOf(x)!==-1; });
    var isAllDone = itemIds.length>0 && itemIds.every(function(x){ return current.indexOf(x)!==-1; });
    tx.set(logRef, { date:tKey, doneIds:current, updatedAt:nowISO() });
    if(isAllDone !== wasAllDone){
      var data = journalSnap.exists() ? journalSnap.data() : {};
      var entries = (data.entries||[]).filter(function(e){ return e.sourceChampion!==tKey; });
      if(isAllDone) entries.push({ id:uid(), text:'Выполнил блок чемпиона', createdAt:nowISO(), sourceChampion:tKey });
      tx.set(journalRef, { date:tKey, entries:entries, updatedAt:nowISO() });
    }
    return current;
  });
}
function applyChampionLogForToday(c, tKey, doneIds){
  c.log[tKey] = doneIds;
  var streakInfo = computeChampionStreak(c.items, c.log);
  c.streak = streakInfo.streak;
  c.todayDone = streakInfo.todayDone;
}
async function toggleChampionItem(id){
  var c = state.champion;
  if(!c.pending) c.pending = {};
  if(c.pending[id]) return; // ignore extra taps while this item's save is in flight
  var tKey = todayKey();
  var itemIds = c.items.map(function(it){ return it.id; });

  // Optimistic update so the tap feels instant even on a slow connection,
  // and so a second tap can't race the first one's save.
  var prevLog = (c.log[tKey] || []).slice();
  var optimistic = prevLog.slice();
  var oi = optimistic.indexOf(id);
  if(oi!==-1) optimistic.splice(oi,1); else optimistic.push(id);
  applyChampionLogForToday(c, tKey, optimistic);
  c.pending[id] = true;
  renderMain();

  var result = await safe(saveChampionToggleWithSuccess(id, tKey, itemIds), 'Не удалось сохранить отметку');
  delete c.pending[id];
  if(result===null){
    applyChampionLogForToday(c, tKey, prevLog); // roll back the optimistic change
    renderMain();
    return;
  }
  applyChampionLogForToday(c, tKey, result);
  renderMain();
}

function renderStreakDashes(n){

  var shown = Math.min(n, cap);
  var out = '';
  for(var i=0;i<shown;i++) out += '<span class="champion-dash"></span>';
  if(n>cap) out += '<span class="hint" style="color:#8FB8AE;margin-left:4px">+'+(n-cap)+'</span>';
  return out;
}
function championDayWord(n){
  var mod10 = n%10, mod100 = n%100;
  if(mod100>=11 && mod100<=14) return 'дней';
  if(mod10===1) return 'день';
  if(mod10>=2 && mod10<=4) return 'дня';
  return 'дней';
}

function financeRange(){
  var f = state.finance;
  var anchor = parseKey(f.anchor);
  if(f.period==='day') return [f.anchor, f.anchor];
  if(f.period==='week'){ var mon=mondayOf(anchor); return [fmtKey(mon), fmtKey(addDays(mon,6))]; }
  if(f.period==='month'){ var y=anchor.getFullYear(), m=anchor.getMonth(); return [fmtKey(new Date(y,m,1)), fmtKey(new Date(y,m+1,0))]; }
  if(f.period==='year'){ var yy=anchor.getFullYear(); return [yy+'-01-01', yy+'-12-31']; }
  return [f.customFrom, f.customTo];
}
async function loadFinance(){
  state.finance.loading = true;
  renderMain();
  var range = financeRange();
  var snap = await safe(refFinanceColl().where('date','>=',range[0]).where('date','<=',range[1]).orderBy('date','asc').get(), 'Не удалось загрузить финансы');
  var rows = snap ? snap.docs.map(function(d){ return d.data(); }) : [];
  var budgetRows = await budgetFinanceRows(range);
  var byDate = {};
  rows.concat(budgetRows).forEach(function(day){
    if(!byDate[day.date]) byDate[day.date] = {date:day.date, transactions:[]};
    byDate[day.date].transactions = byDate[day.date].transactions.concat(day.transactions||[]);
  });
  state.finance.rows = Object.keys(byDate).sort().map(function(date){ return byDate[date]; });
  state.finance.loading = false;
  renderMain();
}
// A monthly budget is one derived expense dated on the first day of that month.
// It is read from the budget, never copied into the transaction collection.
async function budgetFinanceRows(range){
  var cursor = parseKey(range[0]); cursor.setDate(1);
  var last = parseKey(range[1]);
  var months = [];
  while(cursor <= last){
    var date = fmtKey(cursor);
    if(date >= range[0] && date <= range[1]) months.push({ date:date, key:monthKey(cursor.getFullYear(),cursor.getMonth()) });
    cursor.setMonth(cursor.getMonth()+1);
  }
  var rows = await Promise.all(months.map(async function(m){
    var snap = await safe(refBudgetDoc(m.key).get(), 'Не удалось загрузить расход из бюджета');
    if(!snap || !snap.exists) return null;
    var amount = budgetPlannedTotal(snap.data());
    if(!amount) return null;
    return { date:m.date, transactions:[{ id:'budget-'+m.key, type:'expense', amount:amount, note:'Бюджет на месяц', createdAt:m.date+'T00:00:00', fromBudget:true }] };
  }));
  return rows.filter(function(row){ return row!==null; });
}
function financeTotals(rows){
  var income=0, expense=0;
  rows.forEach(function(day){ (day.transactions||[]).forEach(function(t){ if(t.type==='income') income+=t.amount; else expense+=t.amount; }); });
  return { income:income, expense:expense, net:income-expense };
}
async function addTransaction(dateKey, type, amount, note){
  var ref = refFinanceDoc(dateKey);
  var snap = await safe(ref.get());
  var existing = (snap && snap.exists && snap.data().transactions) ? snap.data().transactions : [];
  var tx = { id:uid(), type:type, amount:amount, note:note||'', createdAt:nowISO() };
  var updated = existing.concat([tx]);
  var ok = await safe(ref.set({ date:dateKey, transactions:updated }), 'Не удалось сохранить операцию');
  if(ok!==null){ toast(type==='income'?'Доход добавлен':'Расход добавлен'); loadFinance(); }
}
async function deleteTransaction(dateKey, txId){
  var ref = refFinanceDoc(dateKey);
  var snap = await safe(ref.get());
  if(!snap || !snap.exists) return;
  var updated = (snap.data().transactions||[]).filter(function(t){ return t.id!==txId; });
  var ok = await safe(ref.set({ date:dateKey, transactions:updated }), 'Не удалось удалить операцию');
  if(ok!==null){ loadFinance(); }
}

function periodLabel(){
  var f = state.finance;
  if(f.period==='day') return fmtDateHuman(f.anchor);
  if(f.period==='week'){ var r=financeRange(); return fmtDateShort(r[0])+' – '+fmtDateShort(r[1]); }
  if(f.period==='month') return MONTHS_NOM[parseKey(f.anchor).getMonth()]+' '+parseKey(f.anchor).getFullYear();
  if(f.period==='year') return String(parseKey(f.anchor).getFullYear());
  return fmtDateShort(f.customFrom)+' – '+fmtDateShort(f.customTo);
}

function renderBarChart(rows, period){
  var buckets = [];
  if(period==='year'){
    var byMonth = {};
    rows.forEach(function(day){ var mk=day.date.slice(0,7); byMonth[mk]=byMonth[mk]||{income:0,expense:0}; (day.transactions||[]).forEach(function(t){ byMonth[mk][t.type]+=t.amount; }); });
    for(var i=0;i<12;i++){ var mk = parseKey(state.finance.anchor).getFullYear()+'-'+pad2(i+1); var b=byMonth[mk]||{income:0,expense:0}; buckets.push({label:MONTHS_NOM[i].slice(0,3), value:b.income-b.expense}); }
  } else {
    rows.forEach(function(day){
      var t=financeTotals([day]);
      buckets.push({ label: fmtDateShort(day.date), value: t.net });
    });
  }
  if(!buckets.some(function(b){return b.value!==0;})) return '';
  var max = Math.max(1, Math.max.apply(null, buckets.map(function(b){return Math.abs(b.value);})));
  var w = 320, h = 96, gap = 3;
  var bw = Math.max(2, (w/buckets.length) - gap);
  var mid = h/2;
  var bars = buckets.map(function(b,i){
    var bh = Math.max(1, (Math.abs(b.value)/max) * (h/2 - 6));
    var x = i*(bw+gap);
    var y = b.value>=0 ? mid-bh : mid;
    var color = b.value>=0 ? 'var(--positive)' : 'var(--negative)';
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="'+color+'"></rect>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="0" y1="'+mid+'" x2="'+w+'" y2="'+mid+'" stroke="var(--border)" stroke-width="1"/>'+bars+'</svg>';
}

async function loadBudget(){
  state.budget.loading = true;
  state.budget.editingMeta = false;
  state.budget.editingItem = null;
  renderMain();
  var key = monthKey(state.budget.year, state.budget.month);
  var snap = await safe(refBudgetDoc(key).get(), 'Не удалось загрузить бюджет');
  state.budget.doc = (snap && snap.exists) ? snap.data() : null;

  var start = fmtKey(new Date(state.budget.year, state.budget.month, 1));
  var end = fmtKey(new Date(state.budget.year, state.budget.month+1, 0));
  var fsnap = await safe(refFinanceColl().where('date','>=',start).where('date','<=',end).get());
  var actual = { income:0, expense:0 };
  if(fsnap){ fsnap.docs.forEach(function(d){ (d.data().transactions||[]).forEach(function(t){ actual[t.type]+=t.amount; }); }); }
  state.budget.actual = actual;
  state.budget.loading = false;
  renderMain();
}
function emptyBudgetDoc(){ return { cushion:0, plannedIncome:0, items:[], extraItems:[], updatedAt:nowISO() }; }
function sumAmounts(list){ return (list||[]).reduce(function(s,it){ return s+it.amount; },0); }
function budgetPlannedTotal(doc){ return sumAmounts(doc.items) + sumAmounts(doc.extraItems); }
async function saveBudget(doc){
  var key = monthKey(state.budget.year, state.budget.month);
  doc.updatedAt = nowISO();
  var ok = await safe(refBudgetDoc(key).set(doc), 'Не удалось сохранить бюджет');
  if(ok!==null){ state.budget.doc = doc; toast('Сохранено'); renderMain(); }
  return ok!==null;
}
async function toggleBudgetItemPaid(id, isExtra){
  var doc = clone(state.budget.doc || emptyBudgetDoc());
  var list = isExtra ? 'extraItems' : 'items';
  doc[list] = (doc[list]||[]).map(function(it){ return it.id===id ? Object.assign({}, it, {paid: !it.paid}) : it; });
  doc.updatedAt = nowISO();
  var key = monthKey(state.budget.year, state.budget.month);
  var ok = await safe(refBudgetDoc(key).set(doc), 'Не удалось сохранить отметку');
  if(ok!==null){ state.budget.doc = doc; renderMain(); }
}
async function copyPrevMonth(){
  var y=state.budget.year, m=state.budget.month;
  var pm = m===0?11:m-1, py = m===0?y-1:y;
  var pkey = monthKey(py,pm);
  var snap = await safe(refBudgetDoc(pkey).get());
  var prev = (snap && snap.exists) ? snap.data() : null;
  var doc = emptyBudgetDoc();
  if(prev){
    doc.items = (prev.items||[]).map(function(it){ return {id:uid(), name:it.name, amount:it.amount}; });
    var prevPlanned = budgetPlannedTotal(prev);
    doc.cushion = Math.max(0, (prev.cushion||0) + (prev.plannedIncome||0) - prevPlanned);
    doc.plannedIncome = prev.plannedIncome||0;
  }
  await saveBudget(doc);
}


function budgetItemRow(it, isExtra){

async function editBudgetItem(id, list, name, amount){
  if(!['items','extraItems'].includes(list) || !name || !Number.isFinite(amount) || amount<0) return;
  var doc=clone(state.budget.doc || emptyBudgetDoc());
  doc[list]=(doc[list]||[]).map(function(it){return it.id===id ? Object.assign({},it,{name:name,amount:amount}) : it;});
  var editing=state.budget.editingItem;
  state.budget.editingItem=null;
  if(!await saveBudget(doc)){state.budget.editingItem=editing;renderMain();}
}
async function reorderBudgetItems(list, ids){
  if(!['items','extraItems'].includes(list)) return;
  var doc=clone(state.budget.doc || emptyBudgetDoc()), items=doc[list]||[];
  if(ids.length!==items.length || new Set(ids).size!==items.length || ids.some(function(id){return !items.some(function(it){return it.id===id;});})) return;
  doc[list]=ids.map(function(id){return items.find(function(it){return it.id===id;});});
  await saveBudget(doc);
}
function initBudgetDrag(){
  ['items','extraItems'].forEach(function(key){
    var list=document.getElementById('budget-list-'+key);
    if(!list) return;
    list.addEventListener('contextmenu',function(e){if(e.target.closest('[data-drag-handle]'))e.preventDefault();});
    list.addEventListener('pointerdown',function(e){
      if(e.button!=null && e.button!==0 || !e.target.closest('[data-drag-handle]') || activeDrag) return;
      var x=e.clientX,y=e.clientY,pointer=e.pointerId;
      var timer=setTimeout(function(){
        cleanup();
        if(list.isConnected)onDragListPointerDown(e,list,function(ids){reorderBudgetItems(key,ids);});
      },350);
      function cancel(){clearTimeout(timer);cleanup();}
      function move(ev){if(ev.pointerId===pointer && Math.hypot(ev.clientX-x,ev.clientY-y)>8)cancel();}
      function end(ev){if(ev.pointerId===pointer)cancel();}
      function cleanup(){document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);}
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',end);
      document.addEventListener('pointercancel',end);
    });
  });
}

}

/* =========================================================
   SUMMARY — Сводка
   ========================================================= */
async function loadSummary(){
  state.summary.loading = true;
  renderMain();
  var today = todayDate();

  var bkey = monthKey(today.getFullYear(), today.getMonth());
  var budgetSnap = await safe(refBudgetDoc(bkey).get());
  var budgetDoc = (budgetSnap && budgetSnap.exists) ? budgetSnap.data() : null;

  state.summary = {
    loading:false,
    budgetDoc:budgetDoc
  };
  renderMain();
}

function renderSummary(){
  var s = state.summary;
  var html = renderCoachCard();
  html += renderChampionCard();
  if(s.loading){
    html += skeleton(3);
    html += skeleton(4);
    html += skeleton(3);
    return html;
  }

  html += renderNotes();

  if(s.budgetDoc){
    var planned = budgetPlannedTotal(s.budgetDoc);
    var after = (s.budgetDoc.cushion||0)+(s.budgetDoc.plannedIncome||0)-planned;
    html += '<div class="card">';
    html += '<div class="section-title">Бюджет на месяц</div>';
    html += '<div class="row between"><span>Подушка</span><span class="mono">'+fmtMoney(s.budgetDoc.cushion||0)+'</span></div>';
    html += '<div class="row between"><span>Остаток по плану</span><span class="mono" style="font-weight:600;color:'+(after>=0?'var(--positive)':'var(--negative)')+'">'+fmtSigned(after)+'</span></div>';
    html += '</div>';
  }

  html += '<div class="card">';
  html += '<div class="section-title">Резервная копия</div>';
  html += '<div class="hint" style="margin-top:0;margin-bottom:10px">Данные хранятся в облаке и доступны с любого вашего устройства. Скачайте копию, чтобы иметь резервный файл на случай непредвиденного.</div>';
  html += '<div class="btn-row">';
  html += '<button class="btn btn-ghost btn-sm" data-action="export-data">Скачать копию</button>';
  html += '<label class="btn btn-ghost btn-sm file-btn">Загрузить копию<input type="file" accept="application/json" data-action-field="import-file"></label>';
  html += '</div></div>';

  return html;
}

/* ---------- event delegation ---------- */
document.getElementById('tabbar').addEventListener('click', function(e){
  var btn = e.target.closest('[data-tab]');
  if(!btn) return;
  switchTab(btn.dataset.tab);
});

document.getElementById('main-content').addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var a = btn.dataset.action;

  if(a==='coach-prev'){ stepCoach(-1,false); }
  else if(a==='coach-next'){ stepCoach(1,false); }
  else if(a==='export-data'){ exportData(); }
  else if(a==='abandon-task-start'){ state.tasks.abandoningId = btn.dataset.id; renderMain(); }
  else if(a==='abandon-task-cancel'){ state.tasks.abandoningId = null; renderMain(); }
  else if(a==='journal-prev-month'){ var s=state.journal; s.month--; if(s.month<0){s.month=11;s.year--;} s.selected=fmtKey(new Date(s.year,s.month,Math.min(parseKey(s.selected).getDate(),new Date(s.year,s.month+1,0).getDate()))); loadJournalMonth(); }
  else if(a==='journal-next-month'){ var s2=state.journal; s2.month++; if(s2.month>11){s2.month=0;s2.year++;} s2.selected=fmtKey(new Date(s2.year,s2.month,Math.min(parseKey(s2.selected).getDate(),new Date(s2.year,s2.month+1,0).getDate()))); loadJournalMonth(); }
  else if(a==='journal-select-day'){ loadJournalDay(btn.dataset.key); }
  else if(a==='journal-toggle-calendar'){ state.journal.calendarOpen = !state.journal.calendarOpen; renderMain(); }
  else if(a==='delete-journal-entry'){ if(confirm('Удалить запись?')) deleteJournalEntry(btn.dataset.id); }
  else if(a==='edit-journal-entry-start'){ startEditJournalEntry(btn.dataset.id); }
  else if(a==='edit-journal-entry-cancel'){ cancelEditJournalEntry(); }
  else if(a==='toggle-task'){ toggleTask(btn.dataset.id, btn.dataset.done==='true'); }
  else if(a==='edit-task-start'){state.tasks.editingId=btn.dataset.id;renderMain();}
  else if(a==='edit-task-cancel'){state.tasks.editingId=null;renderMain();}
  else if(a==='delete-task'){ if(confirm('Удалить задачу?')) deleteTask(btn.dataset.id); }
  else if(a==='edit-tracker-start'){state.tracker.editingId=btn.dataset.id;renderMain();}
  else if(a==='edit-tracker-cancel'){state.tracker.editingId=null;renderMain();}
  else if(a==='delete-tracker'){if(confirm('Удалить длинное дело со всеми подзадачами?'))deleteTracker(btn.dataset.id);}
  else if(a==='toggle-subtask'){
    var target=state.tracker.items.find(function(t){return t.id===btn.dataset.id;});
    if(target){var steps=clone(target.subtasks||[]);var step=steps.find(function(s){return s.id===btn.dataset.subid;});if(step){step.done=!step.done;changeTrackerSubtasks(target.id,steps);}}
  }
  else if(a==='edit-subtask-start'){state.tracker.editingSubtask=btn.dataset.id+':'+btn.dataset.subid;renderMain();}
  else if(a==='edit-subtask-cancel'){state.tracker.editingSubtask=null;renderMain();}
  else if(a==='delete-subtask'){
    if(confirm('Удалить подзадачу?')){var parent=state.tracker.items.find(function(t){return t.id===btn.dataset.id;});if(parent)changeTrackerSubtasks(parent.id,(parent.subtasks||[]).filter(function(s){return s.id!==btn.dataset.subid;}));}
  }
  else if(a==='edit-note-start'){state.notes.editingId=btn.dataset.id;renderMain();}
  else if(a==='edit-note-cancel'){if(speechSession)stopDictation();state.notes.editingId=null;renderMain();}
  else if(a==='delete-note'){if(confirm('Удалить заметку?'))deleteNote(btn.dataset.id);}
  else if(a==='dictate-note'){startDictation(btn.dataset.id);}
  else if(a==='set-finance-period'){ state.finance.period=btn.dataset.period; loadFinance(); }
  else if(a==='finance-shift'){
    var dir=Number(btn.dataset.dir); var f=state.finance; var d=parseKey(f.anchor);
    if(f.period==='day') d=addDays(d,dir);
    else if(f.period==='week') d=addDays(d,dir*7);
    else if(f.period==='month') d=new Date(d.getFullYear(), d.getMonth()+dir, 1);
    else if(f.period==='year') d=new Date(d.getFullYear()+dir, d.getMonth(), 1);
    f.anchor=fmtKey(d); loadFinance();
  }
  else if(a==='delete-tx'){ if(confirm('Удалить операцию?')) deleteTransaction(btn.dataset.date, btn.dataset.id); }
  else if(a==='budget-prev-month'){ var b=state.budget; b.month--; if(b.month<0){b.month=11;b.year--;} loadBudget(); }
  else if(a==='budget-next-month'){ var b2=state.budget; b2.month++; if(b2.month>11){b2.month=0;b2.year++;} loadBudget(); }
  else if(a==='copy-prev-month'){ copyPrevMonth(); }
  else if(a==='start-empty-budget'){ saveBudget(emptyBudgetDoc()); }
  else if(a==='budget-edit-item-start'){state.budget.editingItem={id:btn.dataset.id,list:btn.dataset.list};renderMain();}
  else if(a==='budget-edit-item-cancel'){state.budget.editingItem=null;renderMain();}
  else if(a==='delete-budget-item'){
    var doc = clone(state.budget.doc || emptyBudgetDoc());
    doc.items = (doc.items||[]).filter(function(it){ return it.id!==btn.dataset.id; });
    saveBudget(doc);
  }
  else if(a==='toggle-budget-item-paid'){ toggleBudgetItemPaid(btn.dataset.id); }
  else if(a==='toggle-budget-extra-item-paid'){ toggleBudgetItemPaid(btn.dataset.id, true); }
  else if(a==='budget-edit-meta-start'){ state.budget.editingMeta = true; renderMain(); }
  else if(a==='budget-edit-meta-cancel'){ state.budget.editingMeta = false; renderMain(); }
  else if(a==='delete-budget-extra-item'){
    var docEx = clone(state.budget.doc || emptyBudgetDoc());
    docEx.extraItems = (docEx.extraItems||[]).filter(function(it){ return it.id!==btn.dataset.id; });
    saveBudget(docEx);
  }
  else if(a==='toggle-champion-item'){ toggleChampionItem(btn.dataset.id); }
  else if(a==='champion-edit-start'){ startChampionEdit(); }
  else if(a==='champion-edit-cancel'){ cancelChampionEdit(); }
  else if(a==='champion-add-item'){ addChampionDraftItem(); }
  else if(a==='champion-remove-item'){ removeChampionDraftItem(btn.dataset.id); }
});

document.getElementById('main-content').addEventListener('change', function(e){
  var el = e.target.closest('[data-action-field]');
  if(!el) return;
  if(el.dataset.actionField==='import-file'){
    if(el.files && el.files[0]) importDataFile(el.files[0]);
    el.value = '';
    return;
  }
  if(el.dataset.actionField==='theme-toggle'){
    saveTheme(el.checked?'dark':'light');
    return;
  }
  var f = state.finance;
  if(el.dataset.actionField==='custom-from'){ f.customFrom = el.value; if(f.customTo<f.customFrom) f.customTo=f.customFrom; }
  if(el.dataset.actionField==='custom-to'){ f.customTo = el.value; }
  loadFinance();
});
document.getElementById('main-content').addEventListener('input',function(e){
  if(e.target.id==='new-note-text')state.notes.draft=e.target.value;
  var el = e.target.closest('[data-champion-edit-id]');
  if(el) updateChampionDraftText(el.dataset.championEditId, el.value);
});

document.getElementById('main-content').addEventListener('submit', function(e){
  var form = e.target.closest('form[data-action]');
  if(!form) return;
  e.preventDefault();
  var a = form.dataset.action;
  var fd = new FormData(form);

  if(a==='save-champion-items'){
    saveChampionItems();
  }
  else if(a==='add-journal-entry'){
    var text = (fd.get('text')||'').trim();
    if(!text) return;
    addJournalEntry(text);
    form.reset();
  }
  else if(a==='save-journal-entry'){
    var editedText = (fd.get('text')||'').trim();
    if(!editedText) return;
    saveJournalEntry(form.dataset.id, editedText);
  }
  else if(a==='add-task'){
    var t = (fd.get('text')||'').trim();
    if(!t) return;
    addTask(t);
    form.reset();
  }
  else if(a==='edit-task'){
    var newText=(fd.get('text')||'').trim();if(newText)editTask(form.dataset.id,newText);
  }
  else if(a==='add-tracker'){
    var title=(fd.get('text')||'').trim();if(title){addTracker(title);form.reset();}
  }
  else if(a==='edit-tracker'){
    var trackerTitle=(fd.get('text')||'').trim();if(trackerTitle)updateTracker(form.dataset.id,{text:trackerTitle});
  }
  else if(a==='add-subtask'){
    var subTitle=(fd.get('text')||'').trim(),parent=state.tracker.items.find(function(t){return t.id===form.dataset.id;});
    if(subTitle && parent){changeTrackerSubtasks(parent.id,(parent.subtasks||[]).concat([{id:uid(),text:subTitle,done:false}]));form.reset();}
  }
  else if(a==='edit-subtask'){
    var renamed=(fd.get('text')||'').trim(),pt=state.tracker.items.find(function(t){return t.id===form.dataset.id;});
    if(renamed && pt){var subs=clone(pt.subtasks||[]),sub=subs.find(function(s){return s.id===form.dataset.subid;});if(sub){sub.text=renamed;changeTrackerSubtasks(pt.id,subs).then(function(){state.tracker.editingSubtask=null;renderMain();});}}
  }
  else if(a==='add-note'){
    if(speechSession)stopDictation();
    else {var noteText=(fd.get('text')||'').trim();if(noteText)addNote(noteText);}
  }
  else if(a==='edit-note'){
    var editedNote=(fd.get('text')||'').trim();if(editedNote)editNote(form.dataset.id,editedNote);
  }
  else if(a==='confirm-abandon'){
    var reason = (fd.get('reason')||'').trim();
    if(!reason) return;
    abandonTask(form.dataset.id, reason);
  }
  else if(a==='add-transaction'){
    var date = fd.get('date') || todayKey();
    var amount = Number(fd.get('amount'));
    var note = (fd.get('note')||'').trim();
    var type = (e.submitter && e.submitter.dataset.type) || 'expense';
    if(!amount || amount<=0){ toast('Введите сумму'); return; }
    addTransaction(date, type, amount, note);
    form.reset();
  }
  else if(a==='edit-budget-item'){editBudgetItem(form.dataset.id,form.dataset.list,(fd.get('name')||'').trim(),Number(fd.get('amount')));}
  else if(a==='add-budget-item'){
    var name = (fd.get('name')||'').trim();
    var amt = Number(fd.get('amount'));
    if(!name || !amt) return;
    var doc = clone(state.budget.doc || emptyBudgetDoc());
    doc.items = (doc.items||[]).concat([{id:uid(), name:name, amount:amt}]);
    saveBudget(doc);
    form.reset();
  }
  else if(a==='add-budget-extra-item'){
    var nameEx = (fd.get('name')||'').trim();
    var amtEx = Number(fd.get('amount'));
    if(!nameEx || !amtEx) return;
    var docEx2 = clone(state.budget.doc || emptyBudgetDoc());
    docEx2.extraItems = (docEx2.extraItems||[]).concat([{id:uid(), name:nameEx, amount:amtEx}]);
    saveBudget(docEx2);
    form.reset();
  }
  else if(a==='save-budget-meta'){
    var doc2 = clone(state.budget.doc || emptyBudgetDoc());
    doc2.cushion = Number(fd.get('cushion'))||0;
    doc2.plannedIncome = Number(fd.get('plannedIncome'))||0;
    state.budget.editingMeta = false;
    saveBudget(doc2);
  }
});

/* ---------- boot ---------- */
function showLogin(){
  document.getElementById('account-control').textContent = '';
  document.getElementById('tabbar').innerHTML = '';
  document.getElementById('main-content').innerHTML = '<div class="login-card"><h1>Точка опоры</h1><p>Войдите через Google, чтобы ваши записи, задачи и финансы сохранялись только в вашем аккаунте.</p><button id="google-login">Войти через Google</button></div>';
  document.getElementById('google-login').onclick = async function(){
    try { await signInWithPopup(_auth, new GoogleAuthProvider()); }
    catch(e){ console.error(e); toast(e.code==='auth/unauthorized-domain'?'Добавьте домен сайта в Firebase Authentication':'Не удалось войти через Google'); }
  };
}
function boot(){
  renderHeaderDate();
  document.getElementById('main-content').innerHTML = '<div class="card empty-state">Проверяем вход…</div>';
  onAuthStateChanged(_auth, async function(user){
    activeUser = user;
    applyTheme('light');
    if(!user){ showLogin(); window.finishBootSplash(); return; }
    window.setBootStatus('Собираем ваши дела и победы…');
    document.getElementById('main-content').innerHTML = '<div class="card empty-state">Проверяем и переносим записи…</div>';
    try { await migrateLegacyData(user); }
    catch(e){
      console.error(e);
      var offline = isOfflineError(e);
      var msg = offline ? 'Нет связи с сервером. Проверьте интернет-соединение и попробуйте ещё раз.' : 'Не удалось перенести прежние записи. Проверьте правила Firebase и попробуйте ещё раз.';
      var box = document.getElementById('main-content');
      box.innerHTML = '';
      var card = document.createElement('div'); card.className = 'card empty-state';
      var p = document.createElement('div'); p.textContent = msg; p.style.marginBottom='12px';
      var retryBtn = document.createElement('button'); retryBtn.className='btn btn-primary btn-sm'; retryBtn.textContent='Повторить';
      retryBtn.onclick = function(){ boot(); };
      card.append(p, retryBtn);
      box.appendChild(card);
      window.finishBootSplash();
      return;
    }
    if(_auth.currentUser?.uid !== user.uid) return;
    await loadTheme(user);
    var control = document.getElementById('account-control');
    control.replaceChildren();
    var name = document.createElement('span'); name.textContent = user.displayName || user.email || 'Аккаунт';
    var themeLabel = document.createElement('label');
    themeLabel.className = 'theme-switch header-theme-switch';
    themeLabel.setAttribute('aria-label', 'Переключить тему оформления');
    var themeInput = document.createElement('input');
    themeInput.type = 'checkbox';
    themeInput.checked = state.theme === 'dark';
    themeInput.setAttribute('aria-label', 'Включить тёмную тему');
    var themeSlider = document.createElement('span'); themeSlider.className = 'theme-slider';
    themeLabel.append(themeInput, themeSlider);
    themeInput.onchange = function(){ saveTheme(themeInput.checked ? 'dark' : 'light'); };
    var logout = document.createElement('button'); logout.textContent = 'Выйти';
    logout.onclick = function(){ signOut(_auth).catch(function(e){ console.error(e); toast('Не удалось выйти'); }); };
    control.append(name, themeLabel, logout);
    renderTabbar();
    try{ await switchTab('summary'); }
    finally{ window.finishBootSplash(); }
  }, function(e){ console.error(e); document.getElementById('main-content').textContent='Ошибка входа. Обновите страницу.'; window.finishBootSplash(); });
}
boot();

})();
