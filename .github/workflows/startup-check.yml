name: Startup regression checks
on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/startup-check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/startup.cjs
