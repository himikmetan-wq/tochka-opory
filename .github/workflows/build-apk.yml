name: Build Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install Capacitor Android dependencies
        run: |
          mkdir -p ../node_modules/@capacitor
          npm pack @capacitor/android@7.4.3 --pack-destination /tmp
          mkdir -p ../node_modules/@capacitor/android
          tar -xzf /tmp/capacitor-android-7.4.3.tgz -C ../node_modules/@capacitor/android --strip-components=1
          npm pack @capacitor/local-notifications@7.0.3 --pack-destination /tmp
          mkdir -p ../node_modules/@capacitor/local-notifications
          tar -xzf /tmp/capacitor-local-notifications-7.0.3.tgz -C ../node_modules/@capacitor/local-notifications --strip-components=1

      - name: Generate app icons from base64 source
        run: |
          pip install --quiet pillow
          python3 ../scripts/gen_icons.py

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tochka-opory-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish latest APK to repository
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../../tochka-opory.apk
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tochka-opory.apk
          git commit -m "Publish Android APK v1.3" || exit 0
          git push

# rebuild after signing key rotation
